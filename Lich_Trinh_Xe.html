<style>
  :root{
    --green:#00913f;
    --green-dark:#00702f;
    --green-light:#e6f7ec;
    --yellow:#fff6cc;
    --yellow-border:#f0c419;
    --yellow-text:#7a5b00;
    --text:#1c2b22;
    --muted:#6b7a72;
    --border:#e1e8e3;
    --table-border:#c9d6cf;
    --bg:#f5f8f6;
    --card:#ffffff;
    --surface:#ffffff;
    --surface-2:#f7faf8;
    --hover-bg:#eef7f1;
    --line:#c9d6cf;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --green:#218c50;
    --green-dark:#62bc89;
    --green-light:#172b20;
    --yellow:#3a2f14;
    --yellow-border:#8a6a1f;
    --yellow-text:#f0cf7a;
    --text:#e7ede9;
    --muted:#93a59b;
    --border:#2a332e;
    --table-border:#333f38;
    --bg:#101613;
    --card:#1a221e;
    --surface:#1a221e;
    --surface-2:#212b25;
    --hover-bg:#1e2c24;
    --line:#333f38;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
  }
  header{
    background:linear-gradient(135deg,var(--green),var(--green-dark));
    color:#fff; padding:22px 16px 18px;
    position:sticky; top:0; z-index:50; box-shadow:0 2px 10px rgba(0,0,0,.12);
  }
  header .wrap{max-width:900px; margin:0 auto;}
  header h1{margin:0 0 4px; font-size:20px; letter-spacing:.3px; display:flex; align-items:center; gap:6px;}
  .hk-logo{height:32px; width:32px; border-radius:50%; vertical-align:middle; object-fit:cover; background:#fff; flex-shrink:0;}
  header .sub{font-size:13px; opacity:.9;}

  main{max-width:900px; margin:0 auto; padding:16px;}

  nav.route-tabs{display:flex; gap:8px; overflow-x:auto; padding:14px 0 6px; -webkit-overflow-scrolling:touch;}
  nav.route-tabs::-webkit-scrollbar{height:5px;}
  nav.route-tabs::-webkit-scrollbar-thumb{background:#c8d6cd;border-radius:5px;}
  .tab-btn{
    white-space:nowrap; padding:10px 18px; border-radius:999px; border:1.5px solid var(--border);
    background:var(--surface); color:var(--text); font-size:14px; font-weight:700; cursor:pointer;
    transition:.15s;
  }
  .tab-btn:hover{border-color:var(--green);}
  .tab-btn.active{background:var(--green); border-color:var(--green); color:#fff;}

  .card{background:var(--card); border-radius:14px; padding:18px; margin-bottom:18px; box-shadow:0 1px 4px rgba(0,0,0,.05); border:1px solid var(--border);}
  .route-title{font-size:17px; font-weight:700; color:var(--green-dark); margin:0 0 12px;}

  .dep-label{font-size:12.5px; color:var(--muted); margin-bottom:8px; font-weight:600; text-transform:uppercase; letter-spacing:.3px;}
  .dep-chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .dep-chip{
    padding:9px 16px; border-radius:10px; border:1.5px solid var(--yellow-border); background:var(--yellow);
    color:var(--yellow-text); font-size:14.5px; font-weight:700; cursor:pointer; font-variant-numeric:tabular-nums;
  }
  .dep-chip.active{background:var(--green); border-color:var(--green); color:#fff;}

  .timeline{position:relative; margin-left:6px;}
  .stop{position:relative; padding:0 0 22px 30px;}
  .stop::before{content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--line);}
  .stop:last-child{padding-bottom:0;}
  .stop:last-child::before{display:none;}
  .stop .dot{
    position:absolute; left:-6px; top:2px; width:14px; height:14px; border-radius:50%;
    background:var(--green); border:3px solid var(--card); box-shadow:0 0 0 2px var(--green); z-index:1;
  }
  .stop:first-child .dot{background:#c9770a; box-shadow:0 0 0 2px #c9770a;}
  .stop:last-child .dot{background:var(--green-dark); box-shadow:0 0 0 2px var(--green-dark);}
  .stop .time-row{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .stop .time{font-size:17px; font-weight:800; color:var(--green-dark); font-variant-numeric:tabular-nums;}
  .stop .daybadge{font-size:10.5px; font-weight:700; color:#fff; background:#c9770a; border-radius:5px; padding:1px 6px;}
  .stop .place{font-size:14.5px; font-weight:600; margin-top:2px;}
  .stop .duration{font-size:12px; color:var(--muted); margin-top:6px;}

  footer{max-width:900px; margin:0 auto; padding:8px 16px 32px; font-size:12px; color:var(--muted); text-align:center;}
</style>
</head>

<footer>Thời gian tại các điểm dừng chỉ mang tính chất tham khảo, có thể thay đổi tùy tình hình giao thông thực tế.</footer>

<script>
const ROUTES = [
  {
    "id": "hl-sp",
    "from": "Hạ Long",
    "to": "Sapa",
    "name": "Hạ Long → Sapa",
    "departures": [
      "08:15",
      "12:15",
      "21:00",
      "22:30"
    ],
    "stops": [
      {
        "offset": 0,
        "name": "Văn phòng Hạ Long"
      },
      {
        "offset": 135,
        "name": "Văn phòng 70 Nguyễn Hữu Huân"
      },
      {
        "offset": 180,
        "name": "Sân bay Nội Bài"
      },
      {
        "offset": 435,
        "name": "Văn Phòng Lào Cai"
      },
      {
        "offset": 495,
        "name": "Văn phòng 732 Điện Biên Phủ"
      }
    ]
  },
  {
    "id": "nb-sp",
    "from": "Ninh Bình",
    "to": "Sapa",
    "name": "Ninh Bình → Sapa",
    "departures": [
      "06:30",
      "09:00",
      "11:30",
      "21:00",
      "21:30",
      "22:30"
    ],
    "stops": [
      {
        "offset": 0,
        "name": "Văn phòng 2A đường 27/7 Thành phố Ninh Bình"
      },
      {
        "offset": 120,
        "name": "Văn phòng 70 Nguyễn Hữu Huân (Hà Nội)"
      },
      {
        "offset": 165,
        "name": "Sân bay Nội Bài"
      },
      {
        "offset": 405,
        "name": "Văn Phòng Lào Cai"
      },
      {
        "offset": 465,
        "name": "Văn phòng 732 Điện Biên Phủ"
      }
    ]
  }
];

function fmtTime(totalMin){
  const m = ((totalMin % 1440) + 1440) % 1440;
  const day = Math.floor(totalMin / 1440);
  const hh = String(Math.floor(m/60)).padStart(2,'0');
  const mm = String(m%60).padStart(2,'0');
  return {label: hh+':'+mm, day};
}
function parseHM(s){
  const [h,m] = s.split(':').map(Number);
  return h*60+m;
}
function durLabel(mins){
  const h = Math.floor(mins/60), m = mins%60;
  if(h && m) return h+' giờ '+m+' phút';
  if(h) return h+' giờ';
  return m+' phút';
}

let activeRoute = ROUTES[0].id;
let activeDep = {};

function render(){
  const tabsEl = document.getElementById('routeTabs');
  tabsEl.innerHTML = ROUTES.map(r =>
    `<button class="tab-btn ${r.id===activeRoute?'active':''}" data-route="${r.id}">${r.name}</button>`
  ).join('');
  tabsEl.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeRoute = btn.dataset.route; render(); });
  });

  const route = ROUTES.find(r=>r.id===activeRoute);
  if(!activeDep[route.id]) activeDep[route.id] = route.departures[0];
  const dep = activeDep[route.id];
  const depMin = parseHM(dep);

  const chips = route.departures.map(d =>
    `<button class="dep-chip ${d===dep?'active':''}" data-dep="${d}">${d}</button>`
  ).join('');

  const stops = route.stops.map((s,i)=>{
    const t = fmtTime(depMin + s.offset);
    const dayBadge = t.day>0 ? `<span class="daybadge">+${t.day} ngày</span>` : '';
    let durHtml = '';
    if(i>0){
      const prevOffset = route.stops[i-1].offset;
      durHtml = `<div class="duration">${durLabel(s.offset-prevOffset)} từ ${route.stops[i-1].name}</div>`;
    }
    return `<div class="stop">
      <div class="dot"></div>
      <div class="time-row"><span class="time">${t.label}</span>${dayBadge}</div>
      <div class="place">${s.name}</div>
      ${durHtml}
    </div>`;
  }).join('');

  document.getElementById('routeContent').innerHTML = `
    <div class="card">
      <div class="route-title">${route.name}</div>
      <div class="dep-label">Giờ xuất bến</div>
      <div class="dep-chips">${chips}</div>
      <div class="timeline">${stops}</div>
    </div>
  `;

  document.querySelectorAll('.dep-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeDep[route.id] = btn.dataset.dep; render(); });
  });
}

render();
</script>
