name: Cập nhật lịch xe từ Odoo

"on":
  schedule:
    - cron: "5 * * * *"   # mỗi giờ, phút thứ 5
  workflow_dispatch: {}     # cho phép bấm "Run workflow" thủ công trong tab Actions

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lấy dữ liệu mới từ Odoo và dựng lại trang
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
        run: python scripts/refresh_odoo_data.py

      - name: Commit & push nếu có thay đổi
        run: |
          git config user.name "odoo-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add xep_xe_timeline.html data/kip_lai_theo_ngay.json
          git diff --cached --quiet && echo "Không có gì thay đổi." || (
            git commit -m "Tự động cập nhật lịch xe từ Odoo [skip ci]"
            git push
          )
