<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duyệt đề nghị hoàn tiền</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="gate no-print" id="gate">
  <div class="gate-box">
    <h2>🔒 Trang duyệt nội bộ</h2>
    <p>Nhập mã truy cập để tiếp tục</p>
    <input type="password" id="gateInput" placeholder="Mã truy cập" autocomplete="off">
    <button class="btn primary" id="gateBtn">Vào trang</button>
    <div class="gate-err" id="gateErr">Sai mã truy cập, thử lại.</div>
  </div>
</div>

<div class="toolbar no-print">
  <div class="title"><span class="dot"></span> <span id="pageTitle">Duyệt đề nghị hoàn tiền — Tất cả văn phòng</span></div>
  <button class="btn" id="btnRefresh">↻ Làm mới</button>
</div>

<div id="app"></div>

<script type="module">
import {
  DEPARTMENTS, STATUS_LABEL, fmtVND, fmtDate, fmtDateTime, buildVietQRUrl, parseNum, apiList, apiPost
} from "./shared.js";

// ==== Mã truy cập nội bộ ====
// LƯU Ý BẢO MẬT: chỉ là rào chắn giao diện, không phải bảo mật thật (không có đăng nhập tài khoản).
// Đổi mã tại đây:
const ACCESS_CODE = "hk2026";
const GATE_KEY = "hk_duyet_access_ok";
const gate = document.getElementById("gate");
if (localStorage.getItem(GATE_KEY) === "1") gate.style.display = "none";
document.getElementById("gateBtn").addEventListener("click", checkGate);
document.getElementById("gateInput").addEventListener("keydown", e => { if (e.key === "Enter") checkGate(); });
function checkGate() {
  if (document.getElementById("gateInput").value === ACCESS_CODE) {
    localStorage.setItem(GATE_KEY, "1"); gate.style.display = "none";
  } else {
    document.getElementById("gateErr").style.display = "block";
  }
}

const app = document.getElementById("app");
let allRequests = [];
let currentDept = null; // null = màn hình tổng quan
let currentTab = "cho_duyet";
let selectedCode = null;

async function loadData() {
  app.innerHTML = '<div class="loading-note">Đang tải dữ liệu...</div>';
  try {
    allRequests = await apiList();
  } catch (e) {
    app.innerHTML = '<div class="empty-note">Lỗi tải dữ liệu: ' + e.message + '<br>Kiểm tra API_URL trong shared.js.</div>';
    return;
  }
  render();
}
document.getElementById("btnRefresh").addEventListener("click", loadData);

function render() {
  if (!currentDept) { renderOverview(); return; }
  renderDeptView();
}

function renderOverview() {
  document.getElementById("pageTitle").textContent = "Duyệt đề nghị hoàn tiền — Tất cả văn phòng";
  const html = DEPARTMENTS.map(d => {
    const items = allRequests.filter(r => r.department === d.name);
    const pending = items.filter(r => r.status === "cho_duyet").length;
    return `
      <div class="dept-card" data-name="${d.name}">
        <div class="name">${d.name} <span class="arrow">→</span></div>
        <div class="stats">
          <span class="pending-count ${pending === 0 ? "zero" : ""}">${pending} chờ duyệt</span>
          <span style="color:var(--muted); font-size:12.5px;">${items.length} đơn tổng</span>
        </div>
      </div>`;
  }).join("");
  app.innerHTML = '<div class="dept-grid">' + html + '</div>';
  app.querySelectorAll(".dept-card").forEach(card => {
    card.addEventListener("click", () => {
      currentDept = card.dataset.name;
      currentTab = "cho_duyet";
      selectedCode = null;
      render();
    });
  });
}

const TABS = [
  { key: "cho_duyet", label: "Chờ duyệt" },
  { key: "da_duyet", label: "Đã duyệt - chờ chi" },
  { key: "da_chi", label: "Đã chi" },
  { key: "tu_choi", label: "Từ chối" }
];

function renderDeptView() {
  document.getElementById("pageTitle").textContent = "Duyệt đề nghị hoàn tiền — " + currentDept;
  const deptItems = allRequests.filter(r => r.department === currentDept);

  const tabsHtml = TABS.map(t => {
    const count = deptItems.filter(r => r.status === t.key).length;
    return `<div class="tab ${t.key === currentTab ? "active" : ""}" data-key="${t.key}">${t.label} <span class="count">${count}</span></div>`;
  }).join("");

  const list = deptItems.filter(r => r.status === currentTab).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  const listHtml = list.length ? list.map(r => `
    <div class="req-card" data-code="${r.reqCode}">
      <div class="row1"><span class="code">${r.reqCode}</span><span class="amt">${fmtVND(r.totalRequest)}</span></div>
      <div class="meta">${r.requesterName} · ${fmtDateTime(r.createdAt)}</div>
      <div class="reason">${r.reason || ""}</div>
    </div>`).join("") : '<div class="empty-note">Không có đơn nào.</div>';

  app.innerHTML = `
    <div class="req-list">
      <div class="back-link" id="backLink">← Tất cả văn phòng</div>
      <div class="tabs">${tabsHtml}</div>
      <div id="listContainer">${listHtml}</div>
    </div>
    <div id="detailContainer"></div>
  `;

  document.getElementById("backLink").addEventListener("click", () => { currentDept = null; render(); });
  app.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { currentTab = t.dataset.key; selectedCode = null; render(); }));
  app.querySelectorAll(".req-card").forEach(c => c.addEventListener("click", () => { selectedCode = c.dataset.code; renderDetail(); }));

  if (selectedCode) renderDetail();
}

function renderDetail() {
  const d = allRequests.find(r => r.reqCode === selectedCode);
  const container = document.getElementById("detailContainer");
  if (!d) { container.innerHTML = ""; return; }

  const rowsHtml = (d.rows || []).map((r, i) =>
    `<tr><td class="idx">${i + 1}</td><td>${fmtDate(r.date)}</td><td>${r.code || ""}</td>
     <td>${fmtVND(r.goods)}</td><td>${fmtVND(r.vat)}</td><td class="total-cell">${fmtVND(r.goods + r.vat)}</td>
     <td>${r.reason || ""}</td></tr>`
  ).join("");

  const qrUrl = buildVietQRUrl(d.bankName, d.bankAccount, d.totalApproved != null ? d.totalApproved : d.totalRequest, d.reqCode, d.beneficiary);

  let actionsHtml = "";
  if (d.status === "cho_duyet") {
    actionsHtml =
      '<div class="approve-box"><label>Tổng số duyệt:</label><input type="text" id="approvedAmount" value="' + d.totalRequest + '"></div>' +
      '<button class="btn primary" id="btnApprove">✅ Duyệt</button>' +
      '<button class="btn danger" id="btnReject">❌ Từ chối</button>';
  } else if (d.status === "da_duyet") {
    actionsHtml = '<button class="btn primary" id="btnPaid">💰 Đánh dấu đã chi</button>';
  }

  container.innerHTML = `
    <div class="detail-toolbar no-print">
      <span class="badge ${d.status}">${STATUS_LABEL[d.status]}</span>
      <div class="spacer"></div>${actionsHtml}
      <button class="btn" id="btnPrintDetail">🖨 In</button>
    </div>
    <div class="page-wrap">
      <div class="sheet">
        <div class="doc-header">
          <div class="logo-wrap"><img src="logo.png" style="height:46px;"></div>
          <div class="req-code-box">MÃ ĐỀ NGHỊ<div class="code-line"><b>${d.reqCode}</b></div></div>
        </div>
        <div class="company-name">Công Ty TNHH Dịch Vụ Vận Tải Và Thương Mại HK</div>
        <div class="kg"><div class="to-block">
          <div class="to-line"><span class="to-label">Kính gửi:</span><b>Ban Giám Đốc</b></div>
          <div class="to-line"><span class="to-label"></span>Phòng Tài Chính Kế Toán</div>
        </div></div>
        <div class="doc-title-block"><div class="doc-title">Giấy Đề Nghị Thanh Toán / Hoàn Tiền</div>
          <div class="doc-date">${fmtDateTime(d.createdAt)}</div></div>
        <table class="info-table">
          <tr><td class="label">Họ và tên người đề nghị:</td><td class="value-text">${d.requesterName}</td></tr>
          <tr><td class="label">Bộ phận / Văn phòng:</td><td class="value-text">${d.department}</td></tr>
          <tr><td class="label">Khung thời gian phát sinh:</td><td class="value-text">Từ ${fmtDate(d.fromDate)} đến ${fmtDate(d.toDate)}</td></tr>
          <tr><td class="label">Đề nghị / Nội dung:</td><td class="value-text">${d.reason}</td></tr>
          ${d.status === "tu_choi" ? `<tr><td class="label">Lý do từ chối:</td><td class="value-text" style="color:var(--danger); font-weight:600;">${d.rejectReason || ""}</td></tr>` : ""}
        </table>
        <table class="invoice">
          <colgroup><col style="width:6%"><col style="width:12%"><col style="width:16%"><col style="width:13%"><col style="width:13%"><col style="width:14%"><col style="width:26%"></colgroup>
          <thead><tr><th>STT</th><th>Ngày</th><th>Mã vé</th><th>Tiền hàng</th><th>Thuế GTGT</th><th>Tổng tiền</th><th>Lý do / Ghi chú</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        <div class="totals-bar">
          <div class="totals-cell"><span class="totals-label">Tổng tiền đề nghị</span><span class="totals-value">${fmtVND(d.totalRequest)}</span></div>
          <div class="totals-cell approved"><span class="totals-label">Tổng số được duyệt</span><span class="totals-value">${fmtVND(d.totalApproved)}</span></div>
        </div>
        <div class="bank-section">
          <table class="bank-table">
            <tr><td class="label">Chuyển tiền vào STK:</td><td class="value-text">${d.bankAccount}</td></tr>
            <tr><td class="label">Tại ngân hàng:</td><td class="value-text">${d.bankName}</td></tr>
            <tr><td class="label">Người thụ hưởng:</td><td class="value-text">${d.beneficiary}</td></tr>
          </table>
          ${qrUrl ? `<div class="qr-box"><img src="${qrUrl}"><div class="qr-caption">Quét mã để chuyển khoản</div></div>` : ""}
        </div>
        <table class="approval">
          <thead><tr><th>Người Duyệt</th><th>Người Đề Nghị</th></tr></thead>
          <tbody><tr>
            <td>${d.approvedBy ? `<div class="signer-name">${d.approvedBy}</div><div class="stamp-time">${fmtDateTime(d.approvedAt)}</div>` : '<span class="sign-hint">Chưa duyệt</span>'}</td>
            <td><div class="signer-name">${d.requesterName}</div><div class="stamp-time">${fmtDateTime(d.createdAt)}</div></td>
          </tr></tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById("btnPrintDetail")?.addEventListener("click", () => window.print());
  document.getElementById("btnApprove")?.addEventListener("click", () => approveRequest(d));
  document.getElementById("btnReject")?.addEventListener("click", () => rejectRequest(d));
  document.getElementById("btnPaid")?.addEventListener("click", () => markPaid(d));
}

async function approveRequest(d) {
  const name = prompt("Tên người duyệt:", "");
  if (name === null) return;
  if (!name.trim()) return alert("Vui lòng nhập tên người duyệt.");
  const approvedAmount = parseNum(document.getElementById("approvedAmount").value);
  try {
    await apiPost({ action: "approve", reqCode: d.reqCode, approvedBy: name.trim(), totalApproved: approvedAmount });
    await loadData();
    currentDept = d.department; currentTab = "da_duyet"; selectedCode = d.reqCode; render();
  } catch (e) { alert("Lỗi: " + e.message); }
}
async function rejectRequest(d) {
  const reason = prompt("Lý do từ chối:", "");
  if (reason === null) return;
  if (!reason.trim()) return alert("Vui lòng nhập lý do từ chối.");
  const name = prompt("Tên người từ chối:", "");
  if (name === null) return;
  try {
    await apiPost({ action: "reject", reqCode: d.reqCode, rejectReason: reason.trim(), approvedBy: name.trim() || "" });
    await loadData();
    currentDept = d.department; currentTab = "tu_choi"; selectedCode = d.reqCode; render();
  } catch (e) { alert("Lỗi: " + e.message); }
}
async function markPaid(d) {
  const name = prompt("Tên kế toán xác nhận đã chi:", "");
  if (name === null) return;
  if (!name.trim()) return alert("Vui lòng nhập tên.");
  try {
    await apiPost({ action: "markPaid", reqCode: d.reqCode, paidBy: name.trim() });
    await loadData();
    currentDept = d.department; currentTab = "da_chi"; selectedCode = d.reqCode; render();
  } catch (e) { alert("Lỗi: " + e.message); }
}

loadData();
</script>
</body>
</html>
