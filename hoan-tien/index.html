<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gửi đề nghị hoàn tiền</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="styles.css">
<style>
  .wrong-link{max-width:600px; margin:60px auto; background:#fff; border-radius:12px; padding:32px; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,.1); font-family:"Segoe UI",Arial,sans-serif;}
  .wrong-link h2{color:var(--danger); margin-top:0;}
  .wrong-link a{display:block; margin:6px 0; color:var(--green-dark); font-weight:600;}
  .submitted-banner{
    max-width:900px; margin:0 auto 16px; background:var(--green-light); border:1.5px solid var(--green);
    border-radius:8px; padding:14px 18px; font-family:"Segoe UI",Arial,sans-serif; font-size:13.5px;
    color:var(--green-dark); display:none; align-items:center; justify-content:space-between; gap:12px;
  }
  .submitted-banner.show{display:flex;}
  .my-requests{max-width:900px; margin:0 auto 60px; background:#fff; box-shadow:0 4px 24px rgba(0,0,0,.12); border-radius:12px; padding:20px 24px; font-family:"Segoe UI",Arial,sans-serif;}
  .my-requests h3{margin:0 0 10px; font-size:15px; color:var(--green-dark);}
  .my-row{display:flex; align-items:center; gap:12px; padding:10px 6px; border-bottom:1px solid var(--border); font-size:13px; cursor:pointer; border-radius:6px; transition:.15s;}
  .my-row:hover{background:var(--green-light);}
  .my-row:last-child{border-bottom:none;}
  .my-row .code{font-weight:700; width:180px; flex-shrink:0;}
  .my-row .amt{width:100px; text-align:right; color:var(--green-dark); font-weight:700; flex-shrink:0;}
  .my-row .reason{flex:1; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .my-row .view-hint{color:var(--green-dark); font-size:11.5px; flex-shrink:0;}
  .partial-flag{color:var(--warn); font-weight:700;}
  .raw-paste-panel{margin:-8px 0 16px; padding:12px; background:var(--green-light); border:1px solid var(--green); border-radius:8px;}
  .raw-paste-panel textarea{
    width:100%; font-family:"Courier New",monospace; font-size:13px; padding:8px 10px;
    border:1px solid var(--border); border-radius:6px; resize:vertical;
  }
  .raw-paste-panel code{background:#fff; padding:1px 5px; border-radius:4px;}
</style>
</head>
<body>

<div id="app"></div>

<script type="module">
import {
  DEPARTMENTS, BANKS, STATUS_LABEL, fmtVND, parseNum, fmtDate, fmtDateTime,
  soTienBangChu, genReqCode, buildVietQRUrl, attachmentLinksHtml, hasUnresolvedRejectedLine, pad, apiList, apiPost
} from "./shared.js";

const params = new URLSearchParams(location.search);
const vpSlug = params.get("vp");
const dept = DEPARTMENTS.find(d => d.slug === vpSlug);

if (!dept) {
  document.getElementById("app").innerHTML =
    '<div class="wrong-link">' +
      '<h2>⚠ Link chưa đúng văn phòng</h2>' +
      '<p>Vui lòng dùng link riêng của văn phòng bạn (có dạng <code>?vp=...</code>). Danh sách:</p>' +
      DEPARTMENTS.map(d => '<a href="?vp=' + d.slug + '">' + d.name + ' →</a>').join("") +
    '</div>';
  throw new Error("stop");
}

document.getElementById("app").innerHTML = `
  <div class="toolbar no-print">
    <div class="title"><span class="dot"></span> Gửi đề nghị hoàn tiền — ${dept.name}</div>
    <button class="btn" id="btnAddRow">+ Thêm dòng</button>
    <button class="btn" id="btnRemoveRow">– Xóa dòng cuối</button>
    <button class="btn danger" id="btnReset">🗑 Làm mới form</button>
    <button class="btn" id="btnPrint">🖨 In</button>
    <button class="btn primary" id="btnSubmit">✅ Gửi duyệt</button>
  </div>

  <div class="edit-banner no-print" id="editBanner">
    <div class="edit-banner-text" id="editBannerText"></div>
    <button class="btn" id="btnCancelEdit">✕ Huỷ, tạo đơn mới</button>
  </div>

  <div class="page-wrap">
    <div class="sheet" id="sheet">
      <div class="doc-header">
        <div class="logo-wrap"><img src="logo.png" alt="HK Buslines Limousine"></div>
        <div class="req-code-box">MÃ ĐỀ NGHỊ<div class="code-line"><b id="reqCode"></b></div></div>
      </div>
      <div class="company-name">Công Ty TNHH Dịch Vụ Vận Tải Và Thương Mại HK</div>
      <div class="kg"><div class="to-block">
        <div class="to-line"><span class="to-label">Kính gửi:</span><b>Ban Giám Đốc</b></div>
        <div class="to-line"><span class="to-label"></span>Phòng Tài Chính Kế Toán</div>
      </div></div>
      <div class="doc-title-block">
        <div class="doc-title">Giấy Đề Nghị Thanh Toán / Hoàn Tiền</div>
        <div class="doc-date"><span id="dateText"></span></div>
      </div>

      <table class="info-table">
        <tr><td class="label">Họ và tên người đề nghị:</td><td><input type="text" id="requesterName" placeholder="Nguyễn Văn A"></td></tr>
        <tr><td class="label">Bộ phận / Văn phòng:</td><td><span class="locked-dept">${dept.name}</span></td></tr>
        <tr><td class="label">Khung thời gian phát sinh:</td><td>
          <div class="range-row">
            Từ <input type="date" id="fromDate" class="no-print"><span class="range-text" id="fromDateText">……………</span>
            đến <input type="date" id="toDate" class="no-print"><span class="range-text" id="toDateText">……………</span>
          </div>
        </td></tr>
        <tr><td class="label">Đề nghị / Nội dung:</td><td><textarea id="reasonText" placeholder="Hoàn tiền chênh lệch vé ..."></textarea></td></tr>
      </table>

      <div class="invoice-scroll">
        <table class="invoice">
          <colgroup>
            <col style="width:6%"><col style="width:10%"><col style="width:16%">
            <col style="width:13%"><col style="width:13%"><col style="width:14%">
            <col style="width:28%">
          </colgroup>
          <thead>
            <tr><th rowspan="2">STT</th><th rowspan="2">Ngày</th><th rowspan="2">Nội dung</th>
              <th colspan="3">Số tiền</th><th rowspan="2">Lý do / Ghi chú</th></tr>
            <tr><th>Tiền hàng</th><th>Thuế GTGT</th><th>Tổng tiền</th></tr>
          </thead>
          <tbody id="invoiceBody"></tbody>
        </table>
      </div>

      <div class="add-row-bar no-print">
        <button class="btn" id="btnAddRow2">+ Thêm dòng hoàn tiền</button>
        <button class="btn" id="btnPasteRaw">📋 Dán dữ liệu thô</button>
      </div>
      <div class="raw-paste-panel no-print" id="rawPastePanel" style="display:none;">
        <textarea id="rawPasteInput" rows="6" placeholder="Dán mỗi dòng 1 mã, dạng: ABC123 - 150k&#10;Có thuế thì thêm: ABC123 - 150k - 15k"></textarea>
        <div style="margin-top:8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <button class="btn primary" id="btnParseRaw">✅ Phân tích &amp; điền vào bảng</button>
          <button class="btn" id="btnCancelPaste">Hủy</button>
          <label style="font-size:12px; display:flex; align-items:center; gap:4px; cursor:pointer;">
            <input type="checkbox" id="chkUppercaseCode" checked> Viết hoa mã
          </label>
          <span style="font-size:11.5px; color:var(--muted);">Mỗi dòng: <code>Nội dung - Tiền hàng - Thuế GTGT</code> (thuế không bắt buộc). Sẽ thay toàn bộ bảng hiện tại.</span>
        </div>
      </div>

      <div class="attach-section no-print">
        <label class="attach-label" for="attachInput">📎 File đính kèm (ảnh hoá đơn, chứng từ... không bắt buộc — tối đa 5 file, tổng ≤ 8MB)</label>
        <input type="file" id="attachInput" multiple accept="image/*,.pdf,.heic">
        <div class="attach-list" id="attachList"></div>
      </div>

      <div class="totals-bar">
        <div class="totals-cell"><span class="totals-label">Tổng tiền đề nghị</span><span class="totals-value" id="totalRequest">đ0</span></div>
      </div>

      <div class="amount-words">Số tiền bằng chữ: <b id="amountWords">Không đồng</b></div>

      <div class="bank-section">
        <table class="bank-table">
          <tr><td class="label">Đề nghị chuyển tiền vào STK:</td><td><input type="text" id="bankAccount" value="937869080"></td></tr>
          <tr><td class="label">Tại ngân hàng:</td><td><select id="bankSelect"></select></td></tr>
          <tr><td class="label">Người thụ hưởng:</td><td><input type="text" id="beneficiary" placeholder="Trùng tên người đề nghị"></td></tr>
        </table>
        <div class="qr-box"><img id="qrImage" alt="Mã QR chuyển khoản" src="" style="visibility:hidden"><div class="qr-caption">Quét mã để chuyển khoản</div></div>
      </div>

      <footer class="hint no-print">Điền đầy đủ thông tin rồi bấm "Gửi duyệt" — Ban Giám Đốc sẽ thấy đơn ngay trong danh sách của ${dept.name}.</footer>
    </div>
  </div>

  <div class="submitted-banner no-print" id="submittedBanner">
    <span>✅ Đã gửi đơn <b id="submittedCode"></b> — đang chờ Ban Giám Đốc duyệt.</span>
    <button class="btn primary" id="btnNewRequest">+ Tạo đơn mới</button>
  </div>
  <div style="height:16px;"></div>
  <div class="my-requests no-print">
    <h3>Đơn của ${dept.name} đã gửi gần đây</h3>
    <p style="margin:-4px 0 12px; font-size:12px; color:var(--muted);">Bấm vào một đơn để xem lại chi tiết (lý do duyệt/từ chối, dòng nào bị từ chối...).</p>
    <div id="myRequestsList">Đang tải...</div>
  </div>

  <div class="detail-overlay no-print" id="detailOverlay">
    <div class="detail-modal" id="detailModal"></div>
  </div>
`;

const invoiceBody = document.getElementById("invoiceBody");
let currentGrandTotal = 0;

// ---- File đính kèm ----
const MAX_ATTACH_FILES = 5;
const MAX_ATTACH_TOTAL_BYTES = 8 * 1024 * 1024; // 8MB
let selectedFiles = [];
let existingAttachments = []; // file đã gửi từ trước (khi đang sửa đơn bị từ chối), chỉ xem, không xoá ở đây

// ---- Sửa & gửi lại đơn bị từ chối ----
let editingReqCode = null;
// ---- Gửi đơn bổ sung riêng cho các dòng bị từ chối trong 1 đơn đã duyệt/đã chi ----
let supplementalSourceReqCode = null;

function fmtBytes(n) {
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}
function renderAttachList() {
  const box = document.getElementById("attachList");
  const existingHtml = existingAttachments.map(a => `
    <div class="attach-chip existing">
      <span class="attach-name" title="${a.name}">📎 ${a.name} <span class="resubmit-hint">(đã gửi trước đó)</span></span>
      <a href="${a.url}" target="_blank" rel="noopener noreferrer" class="attach-link">Xem</a>
    </div>
  `).join("");
  const newHtml = selectedFiles.map((f, i) => `
    <div class="attach-chip">
      <span class="attach-name" title="${f.name}">📄 ${f.name}</span>
      <span class="attach-size">${fmtBytes(f.size)}</span>
      <button type="button" class="attach-remove" data-idx="${i}" title="Bỏ file này">✕</button>
    </div>
  `).join("");
  if (!existingHtml && !newHtml) { box.innerHTML = ""; return; }
  box.innerHTML = existingHtml + newHtml +
    (selectedFiles.length ? `<div class="attach-total">File mới: ${fmtBytes(selectedFiles.reduce((s, f) => s + f.size, 0))} / ${fmtBytes(MAX_ATTACH_TOTAL_BYTES)}</div>` : "");
  box.querySelectorAll(".attach-remove").forEach(btn => {
    btn.addEventListener("click", () => { selectedFiles.splice(Number(btn.dataset.idx), 1); renderAttachList(); });
  });
}
document.getElementById("attachInput").addEventListener("change", e => {
  const incoming = Array.from(e.target.files || []);
  e.target.value = ""; // cho phép chọn lại cùng 1 file sau khi xoá
  for (const f of incoming) {
    if (selectedFiles.length >= MAX_ATTACH_FILES) { alert("Chỉ được đính kèm tối đa " + MAX_ATTACH_FILES + " file."); break; }
    const total = selectedFiles.reduce((s, x) => s + x.size, 0) + f.size;
    if (total > MAX_ATTACH_TOTAL_BYTES) { alert("Tổng dung lượng file đính kèm vượt quá " + fmtBytes(MAX_ATTACH_TOTAL_BYTES) + "."); break; }
    selectedFiles.push(f);
  }
  renderAttachList();
});
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",").pop());
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function buildAttachmentsPayload() {
  return Promise.all(selectedFiles.map(async f => ({
    name: f.name,
    mimeType: f.type || "application/octet-stream",
    data: await fileToBase64(f)
  })));
}

const bankSelect = document.getElementById("bankSelect");
BANKS.forEach(b => { const o = document.createElement("option"); o.value = b.name; o.textContent = b.name; bankSelect.appendChild(o); });
bankSelect.value = "MB Bank";

function updateDateText() {
  const d = new Date();
  document.getElementById("dateText").textContent = "Ngày " + d.getDate() + " Tháng " + (d.getMonth() + 1) + " Năm " + d.getFullYear();
}
function newReqCode() { document.getElementById("reqCode").textContent = genReqCode(); }

function updateRangeText() {
  const from = document.getElementById("fromDate").value;
  const to = document.getElementById("toDate").value;
  document.getElementById("fromDateText").textContent = from ? fmtDate(from) : "……………";
  document.getElementById("toDateText").textContent = to ? fmtDate(to) : "……………";
}
document.getElementById("fromDate").addEventListener("change", updateRangeText);
document.getElementById("toDate").addEventListener("change", updateRangeText);

function updateRowDateText(tr) {
  const v = tr.querySelector(".inv-date").value;
  tr.querySelector(".inv-date-text").textContent = v ? fmtDate(v) : "……………";
}

function renumber() { invoiceBody.querySelectorAll("tr").forEach((tr, i) => tr.querySelector(".idx").textContent = i + 1); }
function recalcRow(tr) {
  const goods = parseNum(tr.querySelector(".inv-goods").value);
  const vat = parseNum(tr.querySelector(".inv-vat").value);
  tr.querySelector(".total-cell").textContent = fmtVND(goods + vat);
  recalcGrandTotal();
}
function recalcGrandTotal() {
  let sum = 0;
  invoiceBody.querySelectorAll("tr").forEach(tr => { sum += parseNum(tr.querySelector(".inv-goods").value) + parseNum(tr.querySelector(".inv-vat").value); });
  currentGrandTotal = sum;
  document.getElementById("totalRequest").textContent = fmtVND(sum);
  document.getElementById("amountWords").textContent = soTienBangChu(sum);
  updateQR();
}
function addRow() {
  const tr = document.createElement("tr");
  tr.innerHTML =
    '<td class="idx">1</td>' +
    '<td><input type="date" class="inv-date no-print"><span class="range-text inv-date-text">……………</span></td>' +
    '<td><input type="text" class="inv-code" placeholder="Nội dung"></td>' +
    '<td><input type="text" inputmode="numeric" class="inv-goods" placeholder="0"></td>' +
    '<td><input type="text" inputmode="numeric" class="inv-vat" placeholder="0"></td>' +
    '<td class="total-cell">đ0</td>' +
    '<td class="reason-cell"><input type="text" class="inv-reason" placeholder="-"><button type="button" class="del-row no-print" title="Xóa dòng">✕</button></td>';
  invoiceBody.appendChild(tr);
  tr.querySelectorAll("input").forEach(inp => inp.addEventListener("input", () => recalcRow(tr)));
  tr.querySelector(".inv-goods").addEventListener("input", e => formatCurrencyInput(e.target));
  tr.querySelector(".inv-vat").addEventListener("input", e => formatCurrencyInput(e.target));
  tr.querySelector(".inv-date").addEventListener("change", () => updateRowDateText(tr));
  tr.querySelector(".del-row").addEventListener("click", () => {
    if (invoiceBody.querySelectorAll("tr").length <= 1) return;
    tr.remove(); renumber(); recalcGrandTotal();
  });
  renumber(); recalcRow(tr); updateRowDateText(tr);
}
document.getElementById("btnAddRow").addEventListener("click", addRow);
document.getElementById("btnAddRow2").addEventListener("click", addRow);
document.getElementById("btnRemoveRow").addEventListener("click", () => {
  const rows = invoiceBody.querySelectorAll("tr");
  if (rows.length <= 1) return;
  rows[rows.length - 1].remove(); renumber(); recalcGrandTotal();
});

function formatCurrencyInput(input) {
  const digits = input.value.replace(/[^\d]/g, "");
  input.value = digits ? fmtVND(parseInt(digits, 10)) : "";
}

function parseAmountShorthand(str) {
  str = str.toLowerCase().replace(/,/g, ".").trim();
  const m = str.match(/^([\d.]+)\s*(k|tr|triệu|m)?/);
  if (!m) return 0;
  let num = parseFloat(m[1]);
  if (isNaN(num)) return 0;
  const unit = m[2];
  if (unit === "k") num *= 1000;
  else if (unit === "tr" || unit === "triệu" || unit === "m") num *= 1000000;
  return Math.round(num);
}

document.getElementById("btnPasteRaw").addEventListener("click", () => {
  const panel = document.getElementById("rawPastePanel");
  panel.style.display = panel.style.display === "none" ? "block" : "none";
  if (panel.style.display === "block") document.getElementById("rawPasteInput").focus();
});
document.getElementById("btnCancelPaste").addEventListener("click", () => {
  document.getElementById("rawPastePanel").style.display = "none";
  document.getElementById("rawPasteInput").value = "";
});
document.getElementById("btnParseRaw").addEventListener("click", () => {
  const raw = document.getElementById("rawPasteInput").value;
  const lines = raw.split("\n").map(l => l.trim()).filter(l => l);
  const parsed = [];
  const badLines = [];
  const upper = document.getElementById("chkUppercaseCode").checked;
  lines.forEach(line => {
    // Tách theo " - " (có khoảng trắng bao quanh) để không vỡ khi nội dung
    // hoặc mã có dấu gạch ngang dính liền (vd "ABC-123").
    const parts = line.split(/\s+-\s+/).map(p => p.trim()).filter(p => p !== "");
    if (parts.length < 2) { badLines.push(line); return; }

    let code, amount, vat = 0;
    if (parts.length >= 3) {
      // Nội dung - Tiền hàng - Thuế GTGT
      code = parts.slice(0, -2).join(" - ");
      amount = parseAmountShorthand(parts[parts.length - 2]);
      vat = parseAmountShorthand(parts[parts.length - 1]);
    } else {
      // Nội dung - Tiền hàng
      code = parts[0];
      amount = parseAmountShorthand(parts[1]);
    }
    if (upper) code = code.toUpperCase();
    else if (code) code = code.charAt(0).toUpperCase() + code.slice(1);
    if (code && (amount > 0 || vat > 0)) parsed.push({ code, amount, vat });
    else badLines.push(line);
  });
  if (!parsed.length) {
    alert("Không đọc được dòng nào hợp lệ. Định dạng cần là: Nội dung - Tiền hàng (- Thuế GTGT nếu có), vd: ABC123 - 150k - 15k");
    return;
  }
  let msg = "Sẽ thay toàn bộ bảng hiện tại bằng " + parsed.length + " dòng vừa dán.";
  if (badLines.length) msg += "\n\n" + badLines.length + " dòng không đọc được, sẽ bị bỏ qua:\n" + badLines.join("\n");
  if (!confirm(msg + "\n\nTiếp tục?")) return;

  const today = new Date();
  const todayStr = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + String(today.getDate()).padStart(2, "0");

  invoiceBody.innerHTML = "";
  parsed.forEach(p => {
    addRow();
    const rows = invoiceBody.querySelectorAll("tr");
    const tr = rows[rows.length - 1];
    tr.querySelector(".inv-date").value = todayStr;
    updateRowDateText(tr);
    tr.querySelector(".inv-code").value = p.code;
    tr.querySelector(".inv-goods").value = p.amount;
    tr.querySelector(".inv-goods").dispatchEvent(new Event("input", { bubbles: true }));
    if (p.vat) {
      tr.querySelector(".inv-vat").value = p.vat;
      tr.querySelector(".inv-vat").dispatchEvent(new Event("input", { bubbles: true }));
    }
  });
  document.getElementById("rawPasteInput").value = "";
  document.getElementById("rawPastePanel").style.display = "none";
});

function updateQR() {
  const acc = document.getElementById("bankAccount").value.trim();
  const name = document.getElementById("beneficiary").value || document.getElementById("requesterName").value;
  const url = buildVietQRUrl(bankSelect.value, acc, currentGrandTotal, document.getElementById("reqCode").textContent, name);
  const img = document.getElementById("qrImage");
  if (!url) { img.style.visibility = "hidden"; return; }
  img.style.visibility = "visible"; img.src = url;
}
bankSelect.addEventListener("change", updateQR);
document.getElementById("bankAccount").addEventListener("input", updateQR);
document.getElementById("beneficiary").addEventListener("input", updateQR);
document.getElementById("requesterName").addEventListener("input", () => { if (!document.getElementById("beneficiary").value) updateQR(); });

function refreshPrintTexts() {
  updateRangeText();
  invoiceBody.querySelectorAll("tr").forEach(updateRowDateText);
}
document.getElementById("btnPrint").addEventListener("click", () => { refreshPrintTexts(); window.print(); });
window.addEventListener("beforeprint", refreshPrintTexts);

function resetForm() {
  document.getElementById("requesterName").value = "";
  document.getElementById("fromDate").value = "";
  document.getElementById("toDate").value = "";
  document.getElementById("reasonText").value = "";
  document.getElementById("bankAccount").value = "937869080";
  bankSelect.value = "MB Bank";
  document.getElementById("beneficiary").value = "";
  invoiceBody.innerHTML = "";
  addRow(); recalcGrandTotal(); newReqCode(); updateRangeText();
  selectedFiles = []; existingAttachments = []; renderAttachList();
  editingReqCode = null;
  supplementalSourceReqCode = null;
  document.getElementById("editBanner").classList.remove("show");
  document.getElementById("btnSubmit").textContent = "✅ Gửi duyệt";
  document.getElementById("btnSubmit").disabled = false;
  document.getElementById("submittedBanner").classList.remove("show");
}
document.getElementById("btnReset").addEventListener("click", () => { if (confirm("Xóa toàn bộ dữ liệu đang nhập và làm mới form?")) resetForm(); });
document.getElementById("btnNewRequest").addEventListener("click", resetForm);
document.getElementById("btnCancelEdit").addEventListener("click", () => { if (confirm("Huỷ sửa đơn này và làm mới form để tạo đơn khác?")) resetForm(); });

async function submitRequest() {
  const requesterName = document.getElementById("requesterName").value.trim();
  const reason = document.getElementById("reasonText").value.trim();
  const rows = Array.from(invoiceBody.querySelectorAll("tr")).map(tr => ({
    date: tr.querySelector(".inv-date").value,
    code: tr.querySelector(".inv-code").value,
    goods: parseNum(tr.querySelector(".inv-goods").value),
    vat: parseNum(tr.querySelector(".inv-vat").value),
    reason: tr.querySelector(".inv-reason").value
  }));
  const hasValidRow = rows.some(r => r.code.trim() && (r.goods + r.vat) > 0);

  if (!requesterName) return alert("Vui lòng nhập họ tên người đề nghị.");
  if (!reason) return alert("Vui lòng nhập nội dung đề nghị.");
  if (!hasValidRow) return alert("Vui lòng nhập ít nhất 1 dòng mã vé kèm số tiền.");

  const reqCode = document.getElementById("reqCode").textContent;
  const beneficiary = document.getElementById("beneficiary").value.trim() || requesterName;
  const isResubmit = !!editingReqCode;

  document.getElementById("btnSubmit").disabled = true;
  try {
    const attachments = await buildAttachmentsPayload();
    const payload = {
      action: isResubmit ? "resubmit" : "create",
      reqCode, requesterName, department: dept.name,
      fromDate: document.getElementById("fromDate").value,
      toDate: document.getElementById("toDate").value,
      reason, rows,
      totalRequest: currentGrandTotal,
      bankAccount: document.getElementById("bankAccount").value.trim(),
      bankName: bankSelect.value,
      beneficiary,
      attachments
    };
    const result = await apiPost(payload);
    const isSupplemental = !!supplementalSourceReqCode;
    if (isResubmit) {
      editingReqCode = null;
      document.getElementById("editBanner").classList.remove("show");
    } else {
      saveToMyRequests(reqCode);
      if (isSupplemental) {
        // Đơn bổ sung gửi thành công — đánh dấu các dòng bị từ chối ở đơn gốc
        // là đã xử lý, để không còn bị nhắc lại trong danh sách nữa.
        try { await apiPost({ action: "acknowledgeRejectedLines", reqCode: supplementalSourceReqCode }); } catch (e) { /* không chặn luồng chính nếu bước này lỗi */ }
        supplementalSourceReqCode = null;
        document.getElementById("editBanner").classList.remove("show");
      }
    }
    document.querySelector("#submittedBanner span").innerHTML = isResubmit
      ? `✅ Đã gửi lại đơn <b>${reqCode}</b> — đang chờ Ban Giám Đốc duyệt lại.`
      : isSupplemental
        ? `✅ Đã gửi đơn bổ sung <b>${reqCode}</b> — đang chờ Ban Giám Đốc duyệt.`
        : `✅ Đã gửi đơn <b>${reqCode}</b> — đang chờ Ban Giám Đốc duyệt.`;
    document.getElementById("submittedBanner").classList.add("show");
    document.getElementById("submittedBanner").scrollIntoView({ behavior: "smooth" });
    if (result && result.warning) alert(result.warning);
    loadMyRequests();
  } catch (e) {
    alert("Gửi thất bại: " + e.message + "\n\nKiểm tra lại API_URL trong shared.js và cấu hình Apps Script.");
    document.getElementById("btnSubmit").disabled = false;
  }
}
document.getElementById("btnSubmit").addEventListener("click", submitRequest);

const MY_KEY = "hk_my_requests_" + dept.slug;
function saveToMyRequests(reqCode) {
  const list = JSON.parse(localStorage.getItem(MY_KEY) || "[]");
  list.unshift(reqCode);
  localStorage.setItem(MY_KEY, JSON.stringify(list.slice(0, 20)));
}

let myRequestsCache = [];

async function loadMyRequests() {
  const container = document.getElementById("myRequestsList");
  try {
    const all = await apiList();
    const mine = all.filter(r => r.department === dept.name)
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
      .slice(0, 15);
    myRequestsCache = mine;
    if (!mine.length) { container.innerHTML = '<div class="empty-note">Chưa có đơn nào.</div>'; return; }
    container.innerHTML = mine.map(r => {
      // Hiện cờ này bất kể status là gì (đã duyệt, đã chi...) — dòng bị từ
      // chối vẫn cần văn phòng xử lý dù phần còn lại của đơn đã xong.
      const needsAction = r.status !== "tu_choi" && hasUnresolvedRejectedLine(r);
      let reasonText = r.reason || "";
      if (r.status === "tu_choi") {
        reasonText += (r.rejectReason ? " — Lý do từ chối: " + r.rejectReason : "") +
          ' — <span class="resubmit-hint">bấm để sửa &amp; gửi lại</span>';
      } else if (needsAction) {
        reasonText += ' — <span class="partial-flag">⚠ có mục bị từ chối, bấm xem chi tiết để xử lý</span>';
      }
      if (r.history && r.history.length) reasonText += ` <span class="resubmit-hint">🔁 đã gửi lại ${r.history.length} lần</span>`;
      if (r.attachments && r.attachments.length) reasonText += ` <span class="attach-hint">📎 ${r.attachments.length}</span>`;
      return `
      <div class="my-row" data-code="${r.reqCode}">
        <span class="code">${r.reqCode}</span>
        <span class="badge ${r.status}">${STATUS_LABEL[r.status] || r.status}</span>
        <span class="amt">${fmtVND(r.totalApproved != null ? r.totalApproved : r.totalRequest)}</span>
        <span class="reason">${reasonText}</span>
        <span class="view-hint no-print">Xem chi tiết →</span>
      </div>`;
    }).join("");
    container.querySelectorAll(".my-row").forEach(row => {
      row.addEventListener("click", () => openDetail(row.dataset.code));
    });
  } catch (e) {
    container.innerHTML = '<div class="empty-note">Không tải được danh sách (kiểm tra API_URL trong shared.js).</div>';
  }
}

function openDetail(reqCode) {
  const d = myRequestsCache.find(r => r.reqCode === reqCode);
  if (!d) return;

  const rowsHtml = (d.rows || []).map((r, i) => {
    let noteCell = r.reason || "";
    if (r.lineStatus === "tu_choi") {
      noteCell += `<div class="line-reject-note">✕ Dòng này bị từ chối${r.lineRejectReason ? ": " + r.lineRejectReason : ""}</div>`;
    }
    return `<tr><td class="idx" data-label="STT">${i + 1}</td><td data-label="Ngày">${fmtDate(r.date)}</td><td data-label="Nội dung">${r.code || ""}</td>
      <td data-label="Tiền hàng">${fmtVND(r.goods)}</td><td data-label="Thuế GTGT">${fmtVND(r.vat)}</td><td class="total-cell" data-label="Tổng tiền">${fmtVND(r.goods + r.vat)}</td>
      <td data-label="Lý do / Ghi chú" style="text-align:left;">${noteCell}</td></tr>`;
  }).join("");

  const qrUrl = buildVietQRUrl(d.bankName, d.bankAccount, d.totalApproved != null ? d.totalApproved : d.totalRequest, d.reqCode, d.beneficiary);

  const historyHtml = (d.history && d.history.length) ? `
    <div class="resend-history no-print">
      <div class="hist-title">🔁 Đơn này đã được gửi lại ${d.history.length} lần trước đó</div>
      ${d.history.map((h, i) => `<div class="hist-item">Lần ${i + 1}: bị từ chối bởi <b>${h.rejectedBy || "?"}</b> lúc ${fmtDateTime(h.rejectedAt)}${h.rejectReason ? " — Lý do: " + h.rejectReason : ""}</div>`).join("")}
    </div>` : "";

  // Đơn đã duyệt/đã chi nhưng còn dòng bị từ chối chưa xử lý — cho văn phòng
  // chọn: gửi đơn bổ sung riêng cho các dòng đó, hoặc chấp nhận bỏ qua.
  const rejectedLines = (d.rows || []).filter(r => r.lineStatus === "tu_choi" && !r.lineResolved);
  const needsActionHtml = (d.status !== "tu_choi" && rejectedLines.length) ? `
    <div class="resend-history no-print" style="background:#fdecea; border-color:var(--danger);">
      <div class="hist-title" style="color:var(--danger);">⚠ Đơn này có ${rejectedLines.length} mục bị từ chối, phần còn lại vẫn ${STATUS_LABEL[d.status] || d.status}</div>
      ${rejectedLines.map(r => `<div class="hist-item">${r.code || "(không mã)"} — ${fmtVND(r.goods + r.vat)}${r.lineRejectReason ? " — Lý do: " + r.lineRejectReason : ""}</div>`).join("")}
      <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn primary" id="btnSupplemental">🔁 Gửi đơn bổ sung cho các mục này</button>
        <button class="btn" id="btnAcceptRejected">✅ Chấp nhận, không gửi lại</button>
      </div>
    </div>` : "";

  document.getElementById("detailModal").innerHTML = `
    <div class="detail-toolbar no-print">
      <span class="badge ${d.status}">${STATUS_LABEL[d.status] || d.status}</span>
      <div class="spacer"></div>
      ${d.status === "tu_choi" ? '<button class="btn primary" id="btnDetailEdit">✏️ Sửa & Gửi lại</button>' : ""}
      <button class="btn" id="btnDetailPrint">🖨 In</button>
      <button class="btn danger" id="btnDetailClose">✕ Đóng</button>
    </div>
    ${historyHtml}
    ${needsActionHtml}
    <div class="page-wrap">
      <div class="sheet">
        <div class="doc-header">
          <div class="logo-wrap"><img src="logo.png" style="height:46px;"></div>
          <div class="req-code-box">MÃ ĐỀ NGHỊ<div class="code-line"><b>${d.reqCode}</b></div></div>
        </div>
        <div class="company-name">Công Ty TNHH Dịch Vụ Vận Tải Và Thương Mại HK</div>
        <div class="kg"><div class="to-block">
          <div class="to-line"><span class="to-label">Kính gửi:</span><b>Ban Giám Đốc</b></div>
          <div class="to-line"><span class="to-label"></span>Phòng Tài Chính Kế Toán</div>
        </div></div>
        <div class="doc-title-block"><div class="doc-title">Giấy Đề Nghị Thanh Toán / Hoàn Tiền</div>
          <div class="doc-date">${fmtDateTime(d.createdAt)}</div></div>
        <table class="info-table">
          <tr><td class="label">Họ và tên người đề nghị:</td><td class="value-text">${d.requesterName}</td></tr>
          <tr><td class="label">Bộ phận / Văn phòng:</td><td class="value-text">${d.department}</td></tr>
          <tr><td class="label">Khung thời gian phát sinh:</td><td class="value-text">Từ ${fmtDate(d.fromDate)} đến ${fmtDate(d.toDate)}</td></tr>
          <tr><td class="label">Đề nghị / Nội dung:</td><td class="value-text">${d.reason}</td></tr>
          ${d.status === "tu_choi" ? `<tr><td class="label">Lý do từ chối:</td><td class="value-text" style="color:var(--danger); font-weight:600;">${d.rejectReason || ""}</td></tr>` : ""}
          ${d.attachments && d.attachments.length ? `<tr class="no-print"><td class="label">File đính kèm:</td><td class="value-text"><div class="attach-links">${attachmentLinksHtml(d.attachments)}</div></td></tr>` : ""}
        </table>
        <div class="invoice-scroll view-only">
          <table class="invoice stack-mobile">
            <colgroup><col style="width:6%"><col style="width:12%"><col style="width:16%"><col style="width:13%"><col style="width:13%"><col style="width:14%"><col style="width:26%"></colgroup>
            <thead><tr><th>STT</th><th>Ngày</th><th>Nội dung</th><th>Tiền hàng</th><th>Thuế GTGT</th><th>Tổng tiền</th><th>Lý do / Ghi chú</th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
        <div class="totals-bar">
          <div class="totals-cell"><span class="totals-label">Tổng tiền đề nghị</span><span class="totals-value">${fmtVND(d.totalRequest)}</span></div>
          <div class="totals-cell approved"><span class="totals-label">Tổng số được duyệt</span><span class="totals-value">${d.status === "tu_choi" ? '<span style="color:var(--danger); font-size:14px;">KHÔNG DUYỆT</span>' : fmtVND(d.totalApproved)}</span></div>
        </div>
        <div class="bank-section">
          <table class="bank-table">
            <tr><td class="label">Chuyển tiền vào STK:</td><td class="value-text">${d.bankAccount}</td></tr>
            <tr><td class="label">Tại ngân hàng:</td><td class="value-text">${d.bankName}</td></tr>
            <tr><td class="label">Người thụ hưởng:</td><td class="value-text">${d.beneficiary}</td></tr>
          </table>
          ${qrUrl ? `<div class="qr-box"><img src="${qrUrl}"><div class="qr-caption">Quét mã để chuyển khoản</div></div>` : ""}
        </div>
        <table class="approval">
          <thead><tr><th>Người Đề Nghị</th><th>Người Duyệt</th><th>Người Chi</th></tr></thead>
          <tbody><tr>
            <td><div class="signer-name">${d.requesterName}</div><div class="stamp-time">${fmtDateTime(d.createdAt)}</div></td>
            <td>${d.approvedBy ? `<div class="signer-name">${d.approvedBy}</div><div class="stamp-time">${fmtDateTime(d.approvedAt)}</div>` : '<span class="sign-hint">Chưa duyệt</span>'}</td>
            <td>${d.paidBy ? `<div class="signer-name">${d.paidBy}</div><div class="stamp-time">${fmtDateTime(d.paidAt)}</div>` : '<span class="sign-hint">Chưa chi</span>'}</td>
          </tr></tbody>
        </table>
      </div>
    </div>
  `;
  document.getElementById("btnDetailClose").addEventListener("click", closeDetail);
  document.getElementById("btnDetailPrint").addEventListener("click", () => {
    // Đánh dấu để CSS @media print chỉ in đúng nội dung modal, không in
    // lẫn cả form tạo đơn phía sau (xem styles.css: #app.printing-detail).
    document.getElementById("app").classList.add("printing-detail");
    window.print();
  });
  document.getElementById("btnDetailEdit")?.addEventListener("click", () => startEdit(d.reqCode));
  document.getElementById("btnSupplemental")?.addEventListener("click", () => startSupplementalRequest(d.reqCode));
  document.getElementById("btnAcceptRejected")?.addEventListener("click", () => acceptRejectedLines(d.reqCode));
  document.getElementById("detailOverlay").classList.add("show");
}
function closeDetail() {
  document.getElementById("detailOverlay").classList.remove("show");
}

function toDateInputValue(v) {
  if (!v) return "";
  const s = String(v);
  const d = s.indexOf("T") >= 0 ? new Date(s) : new Date(s + "T00:00:00");
  if (isNaN(d.getTime())) return "";
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}

function startEdit(reqCode) {
  const d = myRequestsCache.find(r => r.reqCode === reqCode);
  if (!d) return;
  if (d.status !== "tu_choi") { alert("Chỉ sửa & gửi lại được đơn đang ở trạng thái Từ chối."); return; }

  closeDetail();
  editingReqCode = reqCode;

  document.getElementById("requesterName").value = d.requesterName || "";
  document.getElementById("fromDate").value = toDateInputValue(d.fromDate);
  document.getElementById("toDate").value = toDateInputValue(d.toDate);
  document.getElementById("reasonText").value = d.reason || "";
  document.getElementById("bankAccount").value = d.bankAccount || "937869080";
  bankSelect.value = d.bankName || "MB Bank";
  document.getElementById("beneficiary").value = d.beneficiary || "";
  document.getElementById("reqCode").textContent = reqCode; // giữ nguyên mã cũ, không tạo mã mới
  updateRangeText();

  invoiceBody.innerHTML = "";
  const rows = d.rows && d.rows.length ? d.rows : [{}];
  rows.forEach(r => {
    addRow();
    const trs = invoiceBody.querySelectorAll("tr");
    const tr = trs[trs.length - 1];
    tr.querySelector(".inv-date").value = r.date || "";
    updateRowDateText(tr);
    tr.querySelector(".inv-code").value = r.code || "";
    tr.querySelector(".inv-goods").value = r.goods || "";
    tr.querySelector(".inv-goods").dispatchEvent(new Event("input", { bubbles: true }));
    if (r.vat) {
      tr.querySelector(".inv-vat").value = r.vat;
      tr.querySelector(".inv-vat").dispatchEvent(new Event("input", { bubbles: true }));
    }
    tr.querySelector(".inv-reason").value = r.reason || "";
  });
  recalcGrandTotal();

  selectedFiles = [];
  existingAttachments = d.attachments || [];
  renderAttachList();

  document.getElementById("editBannerText").innerHTML =
    `🔁 Đang sửa lại đơn <b>${reqCode}</b> — đã bị <b>từ chối</b> trước đó.` +
    `<div class="edit-reject-reason">Lý do bị từ chối: ${d.rejectReason || "(không ghi lý do)"}</div>` +
    `Sửa nội dung / bổ sung file đính kèm bên dưới rồi bấm "🔁 Gửi lại đơn này".`;
  document.getElementById("editBanner").classList.add("show");
  document.getElementById("btnSubmit").textContent = "🔁 Gửi lại đơn này";
  document.getElementById("btnSubmit").disabled = false;
  document.getElementById("submittedBanner").classList.remove("show");
  document.getElementById("editBanner").scrollIntoView({ behavior: "smooth" });
}

// Đơn đã duyệt/đã chi một phần, còn vài dòng bị từ chối (vd thiếu hoá đơn) —
// tạo 1 đơn MỚI (mã REQ mới) chỉ chứa các dòng đó, không đụng gì tới đơn gốc
// (đơn gốc đã có tiền được duyệt/chi cho phần còn lại, không được sửa lại).
function startSupplementalRequest(reqCode) {
  const d = myRequestsCache.find(r => r.reqCode === reqCode);
  if (!d) return;
  const rejectedLines = (d.rows || []).filter(r => r.lineStatus === "tu_choi" && !r.lineResolved);
  if (!rejectedLines.length) return;

  closeDetail();
  editingReqCode = null;
  supplementalSourceReqCode = reqCode;

  document.getElementById("requesterName").value = d.requesterName || "";
  document.getElementById("fromDate").value = toDateInputValue(d.fromDate);
  document.getElementById("toDate").value = toDateInputValue(d.toDate);
  document.getElementById("reasonText").value = "Bổ sung mục bị từ chối từ đơn " + reqCode + (d.reason ? " — " + d.reason : "");
  document.getElementById("bankAccount").value = d.bankAccount || "937869080";
  bankSelect.value = d.bankName || "MB Bank";
  document.getElementById("beneficiary").value = d.beneficiary || "";
  newReqCode(); // mã đơn mới, không dùng lại mã cũ
  updateRangeText();

  invoiceBody.innerHTML = "";
  rejectedLines.forEach(r => {
    addRow();
    const trs = invoiceBody.querySelectorAll("tr");
    const tr = trs[trs.length - 1];
    tr.querySelector(".inv-date").value = r.date || "";
    updateRowDateText(tr);
    tr.querySelector(".inv-code").value = r.code || "";
    tr.querySelector(".inv-goods").value = r.goods || "";
    tr.querySelector(".inv-goods").dispatchEvent(new Event("input", { bubbles: true }));
    if (r.vat) {
      tr.querySelector(".inv-vat").value = r.vat;
      tr.querySelector(".inv-vat").dispatchEvent(new Event("input", { bubbles: true }));
    }
    tr.querySelector(".inv-reason").value = (r.reason || "") + (r.lineRejectReason ? " (trước bị từ chối: " + r.lineRejectReason + ")" : "");
  });
  recalcGrandTotal();

  selectedFiles = [];
  existingAttachments = [];
  renderAttachList();

  document.getElementById("editBannerText").innerHTML =
    `🔁 Đang tạo đơn <b>bổ sung</b> cho ${rejectedLines.length} mục bị từ chối trong đơn <b>${reqCode}</b>.` +
    `<div class="edit-reject-reason">Đơn gốc (${STATUS_LABEL[d.status] || d.status}) sẽ được giữ nguyên, không bị thay đổi.</div>` +
    `Kiểm tra lại nội dung / thêm file chứng từ (nếu có) rồi bấm "✅ Gửi duyệt" để gửi đơn bổ sung này.`;
  document.getElementById("editBanner").classList.add("show");
  document.getElementById("btnSubmit").textContent = "✅ Gửi duyệt đơn bổ sung";
  document.getElementById("btnSubmit").disabled = false;
  document.getElementById("submittedBanner").classList.remove("show");
  document.getElementById("editBanner").scrollIntoView({ behavior: "smooth" });
}

// Văn phòng xem lý do bị từ chối và quyết định KHÔNG gửi lại — đóng lại,
// không cần theo dõi/nhắc nữa.
async function acceptRejectedLines(reqCode) {
  if (!confirm("Xác nhận chấp nhận các mục bị từ chối này, không gửi lại nữa?")) return;
  try {
    await apiPost({ action: "acknowledgeRejectedLines", reqCode });
    closeDetail();
    await loadMyRequests();
  } catch (e) {
    alert("Lỗi: " + e.message);
  }
}

document.getElementById("detailOverlay").addEventListener("click", e => {
  if (e.target.id === "detailOverlay") closeDetail();
});
window.addEventListener("afterprint", () => document.getElementById("app").classList.remove("printing-detail"));

updateDateText();
newReqCode();
addRow();
recalcGrandTotal();
loadMyRequests();
</script>
</body>
</html>
